<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Suhu</title>
</head>
<body>
    <h2>Check Suhu</h2>

    <label for="suhu">Masukkan suhu: </label>
    <input type="number" id="suhu">
    <button onclick="cekSuhu()">Cek</button>
    <h2>Hasil:</h2>
    <p id="hasil"></p>

    <script>
        function cekSuhu(){
            let suhu = document.getElementById("suhu").value;
            let hasil = "";
            
            switch (true) {
                case (suhu < 20):
                    hasil = "Dingin";
                    break;
                case (suhu >= 20 && suhu <= 29):
                    hasil = "Sejuk";
                    break;
                case (suhu >= 30 && suhu <= 35):
                    hasil = "Normal";
                    break;
                case (suhu > 35):
                    hasil = "Panas";
                    break;
                default:
                    hasil = "Masukkan angka suhu yang valid!";
            }

            document.getElementById("hasil").innerText = hasil;
        }
    </script>
</body>
</html>
